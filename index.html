<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1215" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Železný deník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: jednosloupcová mobilní aplikace, spodní navigace, karta = cvik, řádek = série */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --fg:#15181C; --muted:#5F6670; --line:#D9DDE2;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E4EAFB;
  --ok:#1E8A4C; --ok-bg:#E3F3EA; --danger:#B42318; --scrim:rgba(21,24,28,.45);
  --cardio:#C2410C; --cardio-bg:#FDEBDD;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1215; --surface:#181C21; --fg:#E8EAED; --muted:#98A0AA; --line:#2A3038;
  --accent:#6E92FF; --accent-ink:#0B1020; --accent-soft:#1C2540;
  --ok:#4CC184; --ok-bg:#13281D; --danger:#F07A6E; --scrim:rgba(0,0,0,.6); --cardio:#FB923C; --cardio-bg:#3A2213; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1215; --surface:#181C21; --fg:#E8EAED; --muted:#98A0AA; --line:#2A3038;
  --accent:#6E92FF; --accent-ink:#0B1020; --accent-soft:#1C2540;
  --ok:#4CC184; --ok-bg:#13281D; --danger:#F07A6E; --scrim:rgba(0,0,0,.6); --cardio:#FB923C; --cardio-bg:#3A2213; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
header.top h1{font-family:var(--display);font-size:30px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chip{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.next{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.card.is-next{border-color:var(--ok)}
.card.upd{gap:16px;padding:18px}
.wk-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.discard{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.sheet.pick{max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);gap:10px}
.modal:has(.sheet.pick){padding-top:max(20px,env(safe-area-inset-top,0px))}
.pk-gs{display:flex;flex-wrap:wrap;gap:6px}
.pk-gb{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 11px;font-size:14px;min-height:32px}
.sheet.pick .pk-gb{padding:4px 9px;font-size:13px;min-height:30px}
.pk-gb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pk-list{overflow-y:auto;flex:1;min-height:120px;margin-inline:-6px;padding-inline:6px;overscroll-behavior:contain}
.pk{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:4px 8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.pk-main{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:none;border:none;padding:4px 0;min-width:0;color:var(--fg);cursor:pointer}
.pk-main b{font-weight:600;font-size:15px}
.pk-main span{font-size:13px;color:var(--muted)}
.pk-g{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:right;max-width:96px}
.pk-i{font-family:Georgia,serif;font-style:italic;font-weight:700}
.pk-i.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pk.used .pk-main{opacity:.45;cursor:default}
.pk-d{grid-column:1/-1;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px}
.pk-d p,.tech p{margin:0 0 6px}.pk-d p:last-child,.tech p:last-child{margin:0}
.poz{color:var(--muted)}
.tech{margin:0 0 10px;font-size:14px}
.rvol{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.rvol b{color:var(--fg);font-weight:700}
.lv{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.rvol b .sub{font-weight:400;font-size:13px}
.card.lib{padding:0 14px}
.lb+.lb{border-top:1px solid var(--line)}
.lb-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:12px 0;text-align:left;color:var(--fg);cursor:pointer}
.lb-n{flex:1;min-width:0;display:flex;flex-direction:column}
.lb-n b{font-weight:600;font-size:15px}
.lb-n span{font-size:13px;color:var(--muted)}
.lb-t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.lb-c{width:24px;text-align:center;font-size:20px;color:var(--accent)}
.lb-d{font-size:14px;padding:0 0 12px}
.lb-d p{margin:0 0 6px}
.tech summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
.tech[open]{background:var(--bg);border-radius:8px;padding:4px 10px 10px}
.modal{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;
  padding:max(14vh,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.sheet h2{font-size:22px}
header.top.wk{flex-wrap:wrap;row-gap:6px;padding-block:10px 8px}
@media (max-width:380px){header.top h1{font-size:24px}header.top{gap:8px}}
header.top.wk h1{font-size:26px}
.mini{flex-basis:100%;display:flex;gap:18px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.mini b{font-family:var(--display);font-size:20px;color:var(--fg);letter-spacing:0;margin-right:2px;text-transform:none}
body.rpe-on .fin{visibility:hidden}
.exh{display:flex;align-items:flex-start;gap:10px}
.exh h2{flex:1;min-width:0}
.exvol{display:flex;flex-direction:column;align-items:flex-end;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.exvol b{font-family:var(--display);font-size:20px;line-height:1.1}
.exvol span{font-size:12px;color:var(--muted)}
.cal-head{flex-wrap:nowrap;margin-bottom:10px}
.cal-head h2{text-transform:capitalize;font-size:22px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-variant-numeric:tabular-nums}
.cw{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-bottom:4px}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:46px;max-width:100%;border-radius:8px;font-size:15px;line-height:1.1;color:var(--fg);border:1px solid transparent;background:none;padding:0}
.cd.on{background:var(--ok);color:var(--surface);font-weight:700;cursor:pointer}
.cd.today{border-color:var(--accent)}
.cd.on.c{background:var(--cardio)}
.cd.on.plus-c{box-shadow:inset 0 -6px 0 var(--cardio)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{border:none;background:none;border-radius:7px;min-height:34px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;font-style:normal}
.dot.s{background:var(--ok)}.dot.c{background:var(--cardio)}
.dot.sc{background:linear-gradient(var(--ok) 55%,var(--cardio) 55%)}
.cal-leg{display:flex;gap:14px;margin-top:10px;font-size:13px}.cal-leg span{display:flex;align-items:center;gap:5px}
.kt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;white-space:nowrap}
.kt.strength{background:var(--ok-bg);color:var(--ok)}
.kt.cardio{background:var(--cardio-bg);color:var(--cardio)}
.pk-gb.kgb.on{background:var(--cardio);border-color:var(--cardio);color:var(--surface)}
.btn.kbtn{background:var(--cardio);border-color:var(--cardio);color:var(--surface)}
.card.kcard{border-left:4px solid var(--cardio)}
.card.khist{border-left:4px solid var(--cardio)}
.cd-row{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.sets.we{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 56px 36px}
.cd-row>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.cd-row .txt{padding:0 8px}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.zb{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--display);font-size:20px}
.zb.on{color:#fff;border-color:transparent}
.zb.z1.on{background:#6B7280}.zb.z2.on{background:#2563EB}.zb.z3.on{background:#16A34A}.zb.z4.on{background:#EA580C}.zb.z5.on{background:#DC2626}
.zd{min-height:36px}
.msum summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
.msum summary::-webkit-details-marker{display:none}
.msum summary h2{flex:1;min-width:0}
.sum-c::before{content:"+";display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--accent);font-size:20px;line-height:1}
.msum[open] .sum-c::before{content:"−"}
.msum-b{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.msum h2{font-size:20px;text-transform:none}
.ms h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ms+.ms{border-top:1px solid var(--line);padding-top:14px}
.ms-stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-variant-numeric:tabular-nums}
.ms-stats div{display:flex;flex-direction:column;gap:2px}
.ms-stats b{font-family:var(--display);font-size:22px;line-height:1.1;white-space:nowrap}
.ms-stats span{font-size:12px;color:var(--muted)}
.zbars{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.zr{display:grid;grid-template-columns:30px minmax(0,1fr) 78px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.zn{font-family:var(--display);font-size:16px;text-align:center;border-radius:6px;color:#fff;line-height:22px}
.zt{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.zf{display:block;height:100%;border-radius:6px}
.zv{font-size:14px;text-align:right}
.zn.z1,.zf.z1{background:#6B7280}.zn.z2,.zf.z2{background:#2563EB}.zn.z3,.zf.z3{background:#16A34A}.zn.z4,.zf.z4{background:#EA580C}.zn.z5,.zf.z5{background:#DC2626}
.cn{font-size:9.5px;font-weight:600;letter-spacing:-.02em;white-space:pre;overflow:hidden;max-width:100%;opacity:.95}
.cd.on.today{box-shadow:0 0 0 2px var(--surface) inset}
.erows{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 36px!important}
.erows input{text-align:center}
.ssl{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 4px;margin-right:6px;border-radius:6px;
  font-family:var(--display);font-size:14px;color:var(--muted);background:var(--bg);border:1px solid var(--line);vertical-align:1px}
.ssl.on{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.card.ss{border-left:4px solid var(--accent)}
.sstag{font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.sslink{align-self:center;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:14px;min-height:36px;margin-block:-4px}
.sslink.on{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chg .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 12px;background:var(--bg)}
.chg-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 12px;border-top:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.chg-row b{white-space:nowrap}
.upd-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upd-btns .btn{white-space:nowrap;padding-inline:8px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.card.inactive{background:transparent;border-style:dashed}
.card.inactive h2,.card.inactive .rl{color:var(--muted)}
.card.inactive .rl .v{opacity:.8}
.sect{font-family:var(--display);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 0}
.iconbtn:disabled{opacity:.35}
.btn.danger{color:var(--danger);background:transparent;border-color:transparent}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn.wide{width:100%}
.exlist{color:var(--muted);font-size:14px;margin:6px 0 12px}
.note{font-size:14px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}

/* aktivní trénink */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-bottom:16px;padding-block:10px;border-block:1px solid var(--line);font-variant-numeric:tabular-nums}
.stats div+div{border-left:1px solid var(--line);padding-left:14px}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats b{font-family:var(--display);font-size:28px;line-height:1}
.stats span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ex h2{font-size:22px}
.meta{font-size:13px;color:var(--muted);margin:2px 0 8px}
.hint{font-size:13px;color:var(--ok);font-weight:600;margin:-4px 0 8px}
.exnote{font-size:14px;margin:0 0 10px;padding:8px 10px;border-left:3px solid var(--line);color:var(--fg);white-space:pre-wrap}
.sets{display:grid;grid-template-columns:20px minmax(0,1fr) 52px 40px 48px 38px;gap:6px 4px;align-items:center;font-variant-numeric:tabular-nums}
.sets select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;font-weight:600;text-align:center;padding:0 2px;color:var(--fg)}
.prev small{font-size:11.5px;opacity:.85;margin-left:2px}
.rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:15px;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.rl .v{color:var(--muted);text-align:right}
.rl.rl-only{grid-template-columns:minmax(0,1fr)}
.erows{display:grid;grid-template-columns:44px minmax(0,1fr) 36px;gap:6px;align-items:center;margin-top:8px}
.erows .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.erows input{min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;width:100%}
.tbtn{min-height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:17px}
.tbtn.a{color:var(--muted)}
textarea.txt{min-height:64px;padding:8px 12px;resize:vertical;line-height:1.4}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-bottom:2px}
.lbl{font-family:var(--display);font-size:18px;text-align:center;border-radius:6px;padding:6px 0}
.lbl.a{color:var(--muted);font-size:15px}
.prev{background:none;border:none;text-align:left;color:var(--muted);padding:8px 0;font-size:13.5px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:clip;min-width:0}
.sets input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.sets input::placeholder{color:var(--muted);font-weight:400;opacity:.7}
.chk{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;color:var(--muted)}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.done-row{background:var(--ok-bg)}
.sets .done-row{border-radius:6px}
.addset{margin-top:8px}

.restbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--fg);color:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.restbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.restbar b{font-family:var(--display);font-size:30px;flex:1;font-variant-numeric:tabular-nums}
.restbar button{background:transparent;color:var(--bg);border:1px solid currentColor;border-radius:8px;min-height:40px;padding:0 12px;font-weight:600}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.bottom .in{display:flex;gap:6px;width:100%;max-width:560px}
nav.bottom button{flex:1;border:none;background:none;min-height:48px;border-radius:10px;font-family:var(--display);font-size:18px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
nav.bottom button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* historie */
.hist summary{list-style:none;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hl{display:flex;flex-direction:column;margin-top:10px;font-size:15px;font-variant-numeric:tabular-nums}
/* název cviku nahoře, pod ním odcvičené série */
.hx{display:flex;flex-direction:column;gap:6px;padding-block:8px;border-top:1px solid var(--line)}
.hl .n{font-weight:600}
.hl .v{display:flex;flex-wrap:wrap;gap:6px}
.st{white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:14px;color:var(--fg)}

/* editor */
.ed-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.ed-item:last-child{border-bottom:none}
.ed-fields{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ed-fields label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ed-fields input{width:64px;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center}
.txt{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:36px;height:36px}
@media (prefers-reduced-motion:no-preference){.chk,.btn{transition:background-color .15s,transform .1s}.chk:active,.btn:active{transform:scale(.96)}}
</style>

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r25=x=>Math.round(x/2.5)*2.5;
const fmtD=t=>new Date(t).toLocaleDateString('cs-CZ',{weekday:'short',day:'numeric',month:'numeric'});
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const num=v=>v===''||v==null?null:Number(String(v).replace(',','.'));
const localDate=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const rpeTxt=v=>v?String(v).replace('.',','):'';
const defRows=reps=>[{type:'W',reps},{type:'W',reps}];

/* ---------- ukázková data ---------- */
/* nová instalace: žádné rutiny ani tréninky */
function seed(){
  return {exercises:[],routines:[],workouts:[],active:null,
    planV:3,repsInt:true,restV:1,namesV:7,ssV:1,delInact:1,histClr:1,noAct:true,catV:2};
}
function migrate(S){
  S.routines.forEach(r=>{delete r.day;r.items.forEach(it=>{
    if(!it.rows){it.rows=[];for(let i=0;i<(it.warmup||0);i++)it.rows.push({type:'A',reps:''});
      for(let i=0;i<(it.sets||0);i++)it.rows.push({type:'W',reps:it.reps||''});}
    delete it.warmup;delete it.sets;delete it.reps;if(it.note==null)it.note='';if(it.rest==null)it.rest=120;})});
  return S;
}
function load(){try{const v=localStorage.getItem(KEY);return v?migrate(JSON.parse(v)):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const exName0=(S,id)=>(S.exercises.find(e=>e.id===id)||{}).name||'';
/* cílová opakování: jen celé číslo */
function cleanReps(v){return String(v??'').replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,3)}
/* převod textu/rozsahu na celé číslo: rozsah -> střed (x,5 se zaokrouhluje nahoru) */
function midReps(v){const n=String(v??'').match(/\d+/g);if(!n)return '';
  return String(n.length>1?Math.round((+n[0]+ +n[1])/2):+n[0])}
function numericReps(S){
  S.routines.forEach(r=>r.items.forEach(it=>{
    let perLeg=false;
    it.rows.forEach(row=>{if(/nohu/i.test(row.reps||''))perLeg=true;row.reps=midReps(row.reps)});
    if(perLeg&&!/na (každou )?nohu/i.test(it.note||''))it.note=(it.note?it.note+' · ':'')+'Opakování na každou nohu.';
  }));
  if(S.active)S.active.sets.forEach(x=>{if(x.target!=null)x.target=midReps(x.target)});
  S.repsInt=true;
}
/* pauza podle typu cviku: izolovaný (malá partie) 90 s, komplexní 150 s */
const ISO=/zdvih|raise|curl|pushdown|extension|triceps(?! dip)|face pull|lýtk|předkopáv|zakopáv|reverse fly|rozpažov|shrug|hyperextenz/i;
const isIso=name=>ISO.test(name||'');
const restFor=name=>isIso(name)?90:150;
/* první cvik supersérie má jen krátký přechod na druhý cvik – ten se nemění */
const ssTransition=it=>/Supersérie/i.test(it.note||'')&&it.rest<=45;
function setRests(S){
  S.routines.forEach(r=>r.items.forEach(it=>{if(!ssTransition(it))it.rest=restFor(exName0(S,it.exId))}));
  S.restV=1;
}

  const kg=ks.length?' · '+ks.map(kgTxt).join('/')+' kg':'';
  if(rs.length===1)return `${w.length} × ${rs[0]}${kg}`;

function cleanKg(v){let t=String(v??'').replace(',','.').replace(/[^\d.]/g,'');const k=t.indexOf('.');

/* supersérie: it.ss = cvik je spojený s následujícím; štítky 1, 2, 3a, 3b… */
function groupLabels(items){let n=0,l=0;return items.map((it,k)=>{const linked=k>0&&items[k-1].ss;
  if(linked)l++;else{n++;l=0}const inSS=linked||(it.ss&&k<items.length-1);return {lab:inSS?n+'abcdefgh'[l]:String(n),inSS,first:inSS&&!linked}})}
const rowLabels=rows=>{let a=0,w=0;return rows.map(r=>r.type==='A'?'A'+(++a):String(++w))};

/* další rutina = ta, která v pořadí následuje po naposledy odcvičené (dokola) */
function nextRoutineId(){
  const rs=S.routines;if(!rs.length)return null;
  const last=S.workouts.slice().sort((a,b)=>b.start-a.start).find(w=>rs.some(r=>r.id===w.routineId));
  if(!last)return rs[0].id;
  const i=rs.findIndex(r=>r.id===last.routineId);
  return rs[(i+1)%rs.length].id;
}

  r.items.forEach(it=>it.rows.filter(x=>x.type==='W').forEach(x=>{n++;const k=num(x.kg),p=num(x.reps);if(k&&p)v+=k*p;else miss++}));
  return {v,n,miss}}

/* porovnání tréninku s rutinou: počty sérií (a volitelně opakování) */
function routineDiff(w,takeReps){
  const r=S.routines.find(x=>x.id===w.routineId);if(!r)return null;
  const changes=[],skipped=[],next=[];
  r.items.forEach(it=>{
    const done=w.sets.filter(s=>s.exId===it.exId&&s.type==='W');
    const rows=it.rows.map(x=>({...x}));
    if(!done.length){skipped.push(exName(it.exId));next.push(rows);return}
    let nr=rows.slice(0,done.length);
    while(nr.length<done.length)nr.push({type:'W',reps:(nr[nr.length-1]||{reps:'8'}).reps});
    if(takeReps)nr=nr.map((x,k)=>({...x,reps:cleanReps(done[k].reps)||x.reps,kg:cleanKg(done[k].kg)||x.kg||''}));
    const before=rowsSummary(it),after=rowsSummary({rows:nr});
    if(before!==after||nr.some((x,k)=>!rows[k]||rows[k].reps!==x.reps||(rows[k].kg||'')!==(x.kg||'')))changes.push(`${exName(it.exId)}: ${before} → ${after}`);
    next.push(nr);
  });
  const extra=[...new Set(w.sets.filter(s=>s.type==='W').map(s=>s.exId))].filter(id=>!r.items.some(it=>it.exId===id)).map(id=>{
    const done=w.sets.filter(s=>s.exId===id&&s.type==='W');
    const item={exId:id,rest:restFor(exName(id)),note:'',rows:done.map(d=>({type:'W',reps:cleanReps(d.reps)||'8',kg:takeReps?cleanKg(d.kg):''}))};
    changes.push(`${exName(id)}: nový cvik → ${rowsSummary(item)}`);return item});
  return {r,changes,skipped,next,extra};
}

const MONTHS=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const calOk=w=>{const f=ui.calF||'all';return f==='all'||(f==='c')===isCardio(w)};
function renderCalendar(){
  const now=new Date();if(ui.calM==null)ui.calM=now.getFullYear()*12+now.getMonth();const f=ui.calF||'all';
  const y=Math.floor(ui.calM/12),m=ui.calM%12,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;/* pondělí první */
  const byDay={};S.workouts.filter(calOk).forEach(w=>{const k=dayKey(w.start);(byDay[k]=byDay[k]||[]).push(w)});
  const inMonth=S.workouts.filter(calOk).filter(w=>{const d=new Date(w.start);return d.getFullYear()===y&&d.getMonth()===m});
  const today=dayKey(now.getTime());
  let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){const k=y+'-'+(m+1)+'-'+d,ws=byDay[k];
    if(!ws){cells+=`<span class="cd${k===today?' today':''}">${d}</span>`;continue}
    /* posilování má přednost; kardio ve stejný den se označí proužkem */
    const st=ws.filter(w=>!isCardio(w)),ca=ws.filter(isCardio),main=st[0]||ca[0];
    const cls=st.length?'on'+(ca.length?' plus-c':''):'on c';
    cells+=`<button type="button" class="cd ${cls}${k===today?' today':''}" data-act="calDay" data-id="${main.id}" title="${esc(ws.map(w=>w.name+(isCardio(w)?' ('+cardioLine(w)+')':'')).join(', '))}">${d}<small class="cn">${esc([...main.name].slice(0,6).join(''))}</small></button>`}
  const n=inMonth.length;
  return `<div class="card cal">
    <div class="row cal-head"><button class="iconbtn" type="button" data-act="calMove" data-d="-1" aria-label="Předchozí měsíc">‹</button>
      <h2 class="grow">${MONTHS[m]} ${y}</h2><span class="sub">${n} ${n===1?'trénink':n>=2&&n<=4?'tréninky':'tréninků'}</span>

    <div class="cal-grid">${['po','út','st','čt','pá','so','ne'].map(d=>`<span class="cw">${d}</span>`).join('')}${cells}</div>
    ${f==='all'?'<div class="sub cal-leg"><span><i class="dot s"></i>posilování</span><span><i class="dot c"></i>kardio</span><span><i class="dot sc"></i>oboje</span></div>':''}</div>`;
}
/* ---------- měsíční souhrn pod kalendářem ---------- */
const fmtDur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${h} h${r?' '+r+' min':''}`:`${r} min`};

function renderMonthSummary(){
  const y=Math.floor(ui.calM/12),m=ui.calM%12,f=ui.calF||'all';

function renderWorkout(){

        <button class="chk${s.done?' on':''}" type="button" data-act="check" data-i="${i}" aria-label="Série hotová" aria-pressed="${s.done}">✓</button>`}).join('');
    return `<div class="card ex${g.inSS?' ss':''}">
      ${g.inSS?`<div class="sstag">Supersérie ${g.lab}${nextEx?` · pak hned ${esc(nextEx)}`:''}</div>`:''}
      <div class="exh"><h2>${esc(exName(exId))}</h2>
        <div class="exvol"><b>${fmtVol(vol(a.sets.filter(s=>s.exId===exId&&s.type==='W')))}</b><span>minule ${prev?fmtVol(vol(prev.W)):'—'}</span></div></div>
      <div class="meta">${it.rows.length?esc(rowsSummary(it))+' · ':'přidaný cvik · '}pauza ${fmtT(it.rest)}${prev?' · minule '+fmtD(prev.date):''}</div>

      ${techHTML(S.exercises.find(e=>e.id===exId)||{})}
      ${hit?'<div class="hint">Minule jsi dal horní hranici opakování. Zkus přidat váhu.</div>':''}
      <div class="sets"><span class="h">#</span><span class="h">Minule</span><span class="h">kg</span><span class="h">Opak.</span><span class="h">RPE</span><span class="h"></span>${rows}</div>
      <div class="row addset"><button class="btn small ghost" type="button" data-act="addSet" data-ex="${exId}">+ Série</button></div>

function buildCsv(){
  const cell=v=>{v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const dec=v=>v===''||v==null?'':String(num(v)).replace('.',',');
  const lines=[['datum','zacatek','delka_min','trenink','cvik','typ_serie','serie','kg','opakovani','rpe','objem_kg','zona'].join(';')];
  S.workouts.slice().sort((a,b)=>a.start-b.start).forEach(w=>{
    const d=new Date(w.start),p2=n=>String(n).padStart(2,'0'),date=p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+d.getFullYear(),
      time=d.toTimeString().slice(0,5),dur=Math.round((w.end-w.start)/60000),cnt={};
    if(isCardio(w)){lines.push([date,'',w.dur,w.name,w.name,'kardio','','','','','',ZONES[w.zone]?ZONES[w.zone].n:''].map(cell).join(';'));return}
    w.sets.forEach(s=>{const k=s.exId+s.type;cnt[k]=(cnt[k]||0)+1;
      lines.push([date,time,dur,w.name,exName(s.exId),s.type==='A'?'aktivační':'pracovní',cnt[k],
        dec(s.kg),s.reps,dec(s.rpe),dec((num(s.kg)||0)*(num(s.reps)||0)),''].map(cell).join(';'))});
  });
  return '﻿'+lines.join('\r\n');
}
/* hodnoty z minulého tréninku pro sérii i */
function prevOf(i){const s=S.active.sets[i],prev=prevFor(s.exId);if(!prev)return null;
  let n=0;for(let j=0;j<=i;j++){const t=S.active.sets[j];if(t.exId===s.exId&&t.type===s.type)n++}
  const p=(s.type==='A'?prev.A:prev.W)[n-1];return p?{kg:String(num(p.kg)),reps:String(p.reps)}:null}

function parseCsv(t){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
/* "Oct 24, 2026, 5:29 AM" -> čas v místním pásmu */
function parseHevyDate(v){const m=String(v).match(/([A-Za-z]{3})\w*\s+(\d{1,2}),\s*(\d{4}),?\s+(\d{1,2}):(\d{2})\s*([AP]M)?/i);
  if(!m){const d=Date.parse(v);return isNaN(d)?null:d}
  const mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[1].toLowerCase());
  let h=+m[4];if(m[6]){const pm=m[6].toUpperCase()==='PM';if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}
  return new Date(+m[3],mo,+m[2],h,+m[5]).getTime()}

 'standing calf raise (machine)':'Lýtka ve stoji','seated calf raise':'Lýtka v sedu','romanian deadlift (barbell)':'Rumunský mrtvý tah',
 'triceps dip (weighted)':'Triceps dip (se zátěží)','seated shoulder press (machine)':'Seated shoulder press (stroj)',
 'single arm lateral raise (cable)':'Single arm lateral raise (kladka)','seated cable row - v grip (cable)':'Seated cable row (V-úchop)',
 'chest supported incline row (dumbbell)':'Chest-supported DB row','ez bar biceps curl':'EZ bar curl',
 'rear delt reverse fly (machine)':'Rear delt reverse fly','hammer curl (dumbbell)':'Hammer curl','leg press (machine)':'Leg press',
 'leg extension (machine)':'Předkopávání','seated leg curl (machine)':'Zakopávání v sedu','bulgarian split squat':'Bulharský dřep',
 'back extension (weighted hyperextension)':'Hyperextenze na 45° (s jednoručkou)'};
function hevyPlan(text){
  const rows=parseCsv(text.replace(/^﻿/,''));if(rows.length<2)throw 0;
  const h=rows[0].map(x=>x.trim()),ix=n=>h.indexOf(n);
  const need=['title','start_time','exercise_title','set_index','weight_kg','reps'];if(need.some(n=>ix(n)<0))throw 0;
  const byKey=new Map();
  rows.slice(1).forEach(r=>{const g=n=>(r[ix(n)]??'').trim();
    if(ix('set_type')>=0&&/warmup/i.test(g('set_type')))return;
    const key=g('title')+'|'+g('start_time');
    if(!byKey.has(key))byKey.set(key,{name:g('title')||'Trénink',start:parseHevyDate(g('start_time')),end:parseHevyDate(g('end_time')),rows:[]});
    byKey.get(key).rows.push({ex:g('exercise_title'),i:+g('set_index')||0,kg:g('weight_kg'),reps:g('reps'),rpe:ix('rpe')>=0?g('rpe'):''});
  });
  const ws=[...byKey.values()].filter(w=>w.start&&w.rows.length);
  const have=new Set(S.workouts.map(w=>w.start));
  const fresh=ws.filter(w=>!have.has(w.start));
  const exNames=[...new Set(ws.flatMap(w=>w.rows.map(r=>r.ex)))];
  const target=n=>HEVY_MAP[n.toLowerCase()]||n;
  const known=exNames.filter(n=>S.exercises.some(e=>e.name.toLowerCase()===target(n).toLowerCase()));
  return {ws,fresh,dup:ws.length-fresh.length,exNames,known,target,
    from:Math.min(...ws.map(w=>w.start)),to:Math.max(...ws.map(w=>w.start))};
}
function hevyApply(pl){
  const exId=n=>{const t=pl.target(n);let e=S.exercises.find(x=>x.name.toLowerCase()===t.toLowerCase());
    if(!e){const c=catByName(t)||catByName(n);e={id:uid(),name:t};if(c)e.cat=c.id;S.exercises.push(e)}return e.id};
  pl.fresh.forEach(w=>{
    const r=S.routines.find(x=>x.name.toLowerCase()===w.name.toLowerCase());
    const order=[];w.rows.forEach(x=>{if(!order.includes(x.ex))order.push(x.ex)});
    const sets=order.flatMap(n=>w.rows.filter(x=>x.ex===n).sort((a,b)=>a.i-b.i).map(x=>({exId:exId(n),type:'W',
      kg:x.kg===''?'':String(num(x.kg)),reps:x.reps===''?'0':String(parseInt(x.reps)||0),rpe:x.rpe&&RPE.includes(String(num(x.rpe)))?String(num(x.rpe)):'',done:true})));
    S.workouts.push({id:uid(),routineId:r?r.id:null,name:w.name,start:w.start,end:w.end||w.start,sets,src:'hevy'});
  });
  S.workouts.sort((a,b)=>b.start-a.start);
}
function placeholderOf(i){const s=S.active.sets[i],p=prevOf(i)||{};
  const kg=s.tkg!==''&&s.tkg!=null?String(s.tkg):p.kg, reps=s.target||p.reps;
  return kg||reps?{kg:kg||'',reps:reps||''}:null}
function focusEmpty(i,s){render();const el=$(s.kg===''?'#kg'+i:'#rp'+i);el&&el.focus();}

document.addEventListener('click',e=>{
  const nb=e.target.closest('nav.bottom [data-tab]');
  if(nb){ui.wkMsg='';ui.pick=null;ui.cardio=null;ui.delW=null;ui.tab=nb.dataset.tab;ui.confirm=null;ui.upd=null;ui.hevy=null;ui.exportMsg='';ui.csvText='';window.scrollTo(0,0);return render()}
  let b=e.target.closest('[data-act]');if(b&&b.classList.contains('modal')&&e.target!==b)return;if(!b||b.disabled)return;
  const name=b.dataset.act,wasConfirm=ui.confirm;
  act[name](b.dataset.id,b);
  if(wasConfirm!==null&&(wasConfirm===name||ui.confirm===wasConfirm))ui.confirm=null;
  if(name==='check'&&S.active){const s=S.active.sets[+b.dataset.i];if(!s.done&&(s.kg===''||s.reps===''))return}
  render();
});
function onField(e){
  const t=e.target;
  if(t.id==='updReps'){ui.updReps=t.checked;return render()}
  if(ui.cardio&&/^cd(Type|Date|Dur)$/.test(t.id)){const f={cdType:'type',cdDate:'date',cdDur:'dur'}[t.id];
    let v=t.value;if(f==='dur'){v=v.replace(/\D/g,'').slice(0,3);if(t.value!==v)t.value=v}ui.cardio[f]=v;return}
  if(t.id==='cKind'&&ui.pick&&e.type==='change'){ui.pick.ck=t.value;ui.pick.cn=$('#cName').value;ui.pick.cd=$('#cDesc').value;return render()}
  if(ui.wedit&&t.dataset.wf){const f=t.dataset.wf,v=f==='kg'?cleanKg(t.value):f==='reps'?cleanReps(t.value):(RPE.includes(t.value)?t.value:'');if(f!=='rpe'&&t.value!==v)t.value=v;ui.wedit.sets[+t.dataset.i][f]=v;return}
  if(ui.wedit&&(t.id==='weDate'||t.id==='weDur')){let v=t.value;if(t.id==='weDur'){v=v.replace(/\D/g,'').slice(0,3);if(t.value!==v)t.value=v}ui.wedit[t.id==='weDate'?'date':'dur']=v;return}
  if(t.id==='libQ'&&ui.lib){if(e.type!=='input'||ui.lib.q===t.value)return;ui.lib.q=t.value;ui.lib.info=null;const l=$('#libList');if(l)l.innerHTML=libListHTML();return}
  if(t.id==='pickQ'&&ui.pick){if(e.type!=='input')return;if(ui.pick.q===t.value)return;ui.pick.q=t.value;ui.pick.info=null;const l=$('#pickList');if(l){l.innerHTML=pickListHTML();l.scrollTop=0}return}
  if((t.id==='cName'||t.id==='cDesc')&&ui.pick){ui.pick[t.id==='cName'?'cn':'cd']=t.value;if(t.id==='cName'&&ui.pick.err&&t.value.trim()){ui.pick.err='';const m=[...document.querySelectorAll('.sheet .sub')].pop();if(m&&m.style.color)m.remove()}return}
  if(t.dataset.f&&S.active){const f=t.dataset.f,v=f==='kg'?cleanKg(t.value):f==='reps'?cleanReps(t.value):(RPE.includes(t.value)?t.value:'');if(t.value!==v&&f!=='rpe')t.value=v;S.active.sets[+t.dataset.i][f]=v;save()}
  if(t.dataset.ef&&ui.edit){const it=curItem(t);it[t.dataset.ef]=t.dataset.ef==='rest'?(parseInt(t.value)||0):t.value;save()}
  if(t.dataset.rk&&ui.edit){const v=cleanKg(t.value);if(t.value!==v)t.value=v;curItem(t).rows[+t.dataset.j].kg=v;save();const pv=$('#planVol');if(pv)pv.innerHTML=planTxt(routinePlan(editR()))}
  if(t.dataset.rr&&ui.edit){const v=cleanReps(t.value);if(t.value!==v)t.value=v;curItem(t).rows[+t.dataset.j].reps=v;save();const pv=$('#planVol');if(pv)pv.innerHTML=planTxt(routinePlan(editR()))}
  if(t.id==='rname'){editR().name=t.value;if(ui.err&&t.value.trim())ui.err='';save()}
}
document.addEventListener('change',e=>{
  if(e.target.id!=='restoreFile'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{try{const j=JSON.parse(fr.result);
      if(!j||!j.data||!Array.isArray(j.data.routines)||!Array.isArray(j.data.workouts)||!Array.isArray(j.data.exercises))throw 0;
      ui.pending=j;ui.exportMsg=''}catch(err){ui.pending=null;ui.exportMsg='Soubor není platná záloha této aplikace.'}render()};
  fr.readAsText(e.target.files[0]);
});
document.addEventListener('change',e=>{
  if(e.target.id!=='hevyFile'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{try{ui.hevy=hevyPlan(String(fr.result));ui.exportMsg='';window.scrollTo(0,0)}catch(err){ui.hevy=null;ui.exportMsg='Soubor nevypadá jako export tréninků z Hevy (workouts.csv).'}render()};
  fr.readAsText(e.target.files[0]);
});
/* při výběru RPE se skryje tlačítko Dokončit, aby nešlo omylem stisknout */
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('select[data-f=rpe]'))document.body.classList.add('rpe-on')});
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('select[data-f=rpe]'))setTimeout(()=>{if(!(document.activeElement&&document.activeElement.matches('select[data-f=rpe]')))document.body.classList.remove('rpe-on')},150)});
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('select[data-f=rpe]')){e.target.blur();document.body.classList.remove('rpe-on')}});
document.addEventListener('keydown',e=>{if(!ui.pick)return;
  if(e.key==='Escape'){ui.pick=null;render()}
  if(e.key==='Enter'&&e.target.id==='cName'){e.preventDefault();act.pickCreate();render()}});
document.addEventListener('keydown',e=>{if(ui.delW&&e.key==='Escape'){ui.delW=null;render()}});
document.addEventListener('keydown',e=>{if(ui.cardio&&e.key==='Escape'){ui.cardio=null;render()}});
/* stav sbalení souhrnu přežije překreslení */
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='msum')ui.sumOpen=e.target.open},true);
document.addEventListener('input',onField);
document.addEventListener('change',onField);
render();
</script>
